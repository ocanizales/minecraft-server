services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    volumes:
      - ./data:/data
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Pinned, never LATEST: a Minecraft bump breaks every mod at once.
      # 1.21.1 because Tensura: Reincarnated and all its add-ons stop there
      # (see README "Why 1.21.1").
      VERSION: "1.21.1"
      TZ: "America/Los_Angeles"

      # --- mods (server side only; client list is in README) ---
      # Slugs from modrinth.com/mod/<slug>. The image resolves each to the
      # newest release for 1.21.1 + Fabric and pulls the dependencies each
      # mod declares on Modrinth (fabric-api, fabric-language-kotlin for
      # veinminer, collective for tree-harvester).
      # The last five (architectury-api through manascore) are libraries
      # Tensura's jars require but its Modrinth pages don't declare, so the
      # resolver would never fetch them and the server would refuse to start.
      MODRINTH_PROJECTS: |-
        fabric-api
        lithium
        chunky
        tree-harvester
        appleskin
        veinminer
        minecraft-comes-alive-reborn
        tensura-reincarnated
        tensura-mysticism
        tensura-not-enough-bosses
        tensura-slimethrone-extras
        tensura-better-subordinates
        architectury-api
        geckolib
        smartbrainlib
        terrablender
        manascore
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "release"

      # --- memory ---
      # 4G heap: Tensura alone is a 71 MB mod with heavy mobs and worldgen.
      # Peak co-tenancy: this (~4.5G) + an Ollama 6.6G model load + the
      # music/media stack (~3G) = ~14G of 15G, with 4G swap behind it.
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"

      # --- world / gameplay ---
      MOTD: "bullet's server"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      # Trimmed from the 10/10 defaults: view distance is the single biggest
      # driver of RAM and CPU on a shared box.
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "TRUE"

      # --- console access ---
      # Password lives in .env (gitignored); RCON port is not published.
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"

      UID: "1000"
      GID: "1000"
