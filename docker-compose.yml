services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    volumes:
      - ./data:/data
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Pinned, never LATEST: a Minecraft bump breaks every mod at once.
      # 1.21.1 because Tensura: Reincarnated and all its add-ons stop there
      # (see README "Why 1.21.1"). Both lines are written by pack/build.py.
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.19.5"
      TZ: "America/Los_Angeles"

      # --- mods ---
      # Generated by pack/build.py from pack/mods.toml; edit that file, not
      # this block. Each line is slug:versionId, pinned to the exact build in
      # the player profile so the two never drift apart. Dependencies are
      # already resolved into the list (including the libraries Tensura
      # requires but never declares), so the image fetches nothing extra.
      MODRINTH_PROJECTS: |-
        appleskin:b5ZiCjAr
        architectury-api:Pzc2FP5K
        call-your-horse:8McTlamo
        chunky:RVFHfo1D
        collective:ZQoHzz96
        daycounter:sP06daYC
        fabric-api:Mys3P7lK
        fabric-language-kotlin:SKW1BTL3
        geckolib:tmxM7U4W
        lithium:N08Z8wog
        ly-clumps:tYb6vZfE
        manascore:SmuyLaPd
        minecraft-comes-alive-reborn:eUYBilCG
        smartbrainlib:87gX12Yj
        spawn-animations:xFTfXEwk
        tensura-better-subordinates:hwjrE2VG
        tensura-mysticism:3NYcVNlG
        tensura-not-enough-bosses:x1zTOsKr
        tensura-reincarnated:YQ5c2eA3
        tensura-slimethrone-extras:RvX4wPMr
        terrablender:XNtIBXyQ
        tree-harvester:ejhqrWH2
        veinminer:XJrQXP5u
      # Server mods that aren't on Modrinth ([external] in mods.toml), by URL.
      # When one is updated, delete its old jar from data/mods by hand.
      MODS: |-
        https://mediafilez.forgecdn.net/files/9185/436/betterinventory-fabric-1.21.1-1.5.0.jar
      MODRINTH_DOWNLOAD_DEPENDENCIES: "none"
      # Every line is pinned, but TerraBlender's only 1.21.1 builds are
      # marked beta, so the type filter must not reject them.
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"

      # --- memory ---
      # 8G max heap (~9.5G resident with JVM overhead) out of 15G. Kept back:
      # ~2.2G for the other services, ~2G for Claude Code working on this box,
      # ~1.5G for the nightly seo-ops headless Chromium, plus 4G swap.
      # The heap starts at 4G and only grows as players load the world.
      # Local AI (Ollama's 6.6G model) was turned off on 2026-10-13 to make room.
      # Don't re-enable it without lowering MAX_MEMORY.
      INIT_MEMORY: "4G"
      MAX_MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"

      # --- world / gameplay ---
      MOTD: "bullet's server"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      # Trimmed from the 10/10 defaults: view distance is the single biggest
      # driver of RAM and CPU on a shared box.
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "TRUE"

      # --- console access ---
      # Password lives in .env (gitignored); RCON port is not published.
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"

      UID: "1000"
      GID: "1000"
